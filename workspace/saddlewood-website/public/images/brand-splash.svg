<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="splashGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#333333;stop-opacity:1" />
    </linearGradient>
    <filter id="splashShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
    <pattern id="gridPattern" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#444444" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#splashGradient)"/>
  
  <!-- Decorative grid pattern -->
  <rect width="1200" height="630" fill="url(#gridPattern)" opacity="0.3"/>
  
  <!-- Decorative design elements -->
  <circle cx="600" cy="315" r="300" fill="none" stroke="#444444" stroke-width="1" stroke-dasharray="5,5"/>
  <circle cx="600" cy="315" r="280" fill="none" stroke="#444444" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Logo Circle -->
  <circle cx="600" cy="265" r="120" fill="#000000" stroke="#ffffff" stroke-width="4" filter="url(#splashShadow)"/>
  
  <!-- SC Letters inside the logo -->
  <g transform="translate(540, 220) scale(2)">
    <!-- S letter -->
    <path d="M3,16 C3,10 7,7 13,7 C19,7 24,10 24,16 C24,21 21,24 13,26 C8,27 7,28 7,31 C7,33 9,35 13,35 C17,35 19,33 19,31 L24,31 C24,37 19,40 13,40 C7,40 2,37 2,31 C2,25 6,22 13,20 C19,19 19,18 19,15 C19,13 17,11 13,11 C9,11 7,13 7,16 L3,16 Z" fill="white" />
    <!-- C letter -->
    <path d="M32,13 C32,7 37,4 43,4 C49,4 54,7 54,13 L49,13 C49,9 46,8 43,8 C40,8 37,9 37,13 L37,31 C37,35 40,36 43,36 C46,36 49,35 49,31 L54,31 C54,37 49,40 43,40 C37,40 32,37 32,31 L32,13 Z" fill="white" />
  </g>
  
  <!-- Company Name -->
  <text x="600" y="450" font-family="Arial, sans-serif" font-weight="bold" font-size="60" fill="#ffffff" text-anchor="middle" filter="url(#splashShadow)">SADDLEWOOD</text>
  
  <!-- Company Slogan -->
  <text x="600" y="505" font-family="Arial, sans-serif" font-size="24" fill="#cccccc" text-anchor="middle">QUALITY CONTRACTING SINCE 2007</text>
  
  <!-- Services List -->
  <text x="600" y="550" font-family="Arial, sans-serif" font-size="18" fill="#999999" text-anchor="middle">HVAC • ELECTRICAL • PLUMBING • REMODELING</text>
  
  <!-- Location -->
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="16" fill="#888888" text-anchor="middle">PHOENIX, ARIZONA</text>
</svg>