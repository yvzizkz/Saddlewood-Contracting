<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 400 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dddddd;stop-opacity:1" />
    </linearGradient>
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1"/>
      <feOffset dx="0" dy="1" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <!-- Company Name -->
  <text x="20" y="40" font-family="Arial, sans-serif" font-weight="bold" font-size="32" fill="url(#nameGradient)" filter="url(#textShadow)">SADDLEWOOD</text>
  
  <!-- Accent underline -->
  <line x1="20" y1="45" x2="210" y2="45" stroke="#666666" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Subtitle -->
  <text x="230" y="40" font-family="Arial, sans-serif" font-size="24" fill="url(#nameGradient)" filter="url(#textShadow)">CONTRACTING</text>
</svg>