<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#333333;stop-opacity:1" />
    </linearGradient>
    <filter id="modernShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <!-- Logo Background -->
  <rect x="10" y="20" width="180" height="60" rx="5" ry="5" fill="url(#bgGradient)" filter="url(#modernShadow)"/>
  
  <!-- Contracting Tool Icons -->
  <g transform="translate(20, 35) scale(0.7)">
    <!-- House roof icon -->
    <path d="M0,30 L25,0 L50,30 Z" fill="#666666" stroke="#ffffff" stroke-width="2"/>
    
    <!-- House base -->
    <rect x="10" y="30" width="30" height="20" fill="#666666" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Door -->
    <rect x="20" y="35" width="10" height="15" fill="#444444" stroke="#ffffff" stroke-width="1"/>
  </g>
  
  <!-- Company Name -->
  <text x="65" y="50" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#ffffff" filter="url(#modernShadow)">SADDLEWOOD</text>
  <text x="65" y="65" font-family="Arial, sans-serif" font-size="10" fill="#dddddd">CONTRACTING</text>
  
  <!-- Established Year -->
  <text x="170" y="35" font-family="Arial, sans-serif" font-size="8" fill="#999999">EST. 2007</text>
</svg>